<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist D2C Brand</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f9fafb',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for animations and specific UI components */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Cart Sidebar Slide Animation */
        #cart-sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        #cart-sidebar.open {
            transform: translateX(0);
        }

        /* Cart Overlay Fade */
        #cart-overlay {
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }
        #cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* Toast Notification Slide Up */
        #toast {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            transform: translateY(100%);
            opacity: 0;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Hide Scrollbar for Cart Items */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-white text-brand-900 flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="fixed w-full z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Mobile Menu Button (Dummy) -->
                <div class="flex items-center sm:hidden">
                    <button class="text-gray-500 hover:text-black focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                </div>

                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center justify-center flex-1 sm:justify-start">
                    <a href="#" class="text-xl font-semibold tracking-widest uppercase">
                        Brand Name
                    </a>
                </div>

                <!-- Desktop Menu (Dummy) -->
                <div class="hidden sm:flex sm:space-x-8 items-center">
                    <a href="#" class="text-sm font-medium text-gray-900 border-b-2 border-black pb-1">Shop</a>
                    <a href="#" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">About</a>
                    <a href="#" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">Contact</a>
                </div>

                <!-- Cart Icon -->
                <div class="flex items-center justify-end">
                    <button id="cart-toggle-btn" class="relative p-2 text-gray-600 hover:text-black transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                        <!-- Cart Badge -->
                        <span id="cart-badge" class="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-black rounded-full hidden">
                            0
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative bg-gray-50 pt-16">
        <div class="absolute inset-0 z-0">
            <!-- Placeholder for Hero Image -->
            <img src="https://placehold.co/1920x1080/e2e8f0/64748b?text=New+Collection" alt="Hero Background" class="w-full h-full object-cover opacity-60">
        </div>
        <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-32 sm:py-48 flex flex-col items-center text-center">
            <h1 class="text-4xl sm:text-6xl font-bold tracking-tight text-gray-900 mb-6">
                ESSENTIALS VOL.1
            </h1>
            <p class="mt-4 text-lg sm:text-xl text-gray-700 max-w-2xl mx-auto mb-8">
                シンプルで洗練された、毎日のためのユニセックスコレクション。
            </p>
            <a href="#products" class="inline-block bg-black text-white px-8 py-3 text-sm font-medium uppercase tracking-wider hover:bg-gray-800 transition duration-300">
                Shop the Collection
            </a>
        </div>
    </header>

    <!-- Product Grid Section -->
    <main id="products" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-24 w-full">
        <div class="flex justify-between items-end mb-8">
            <h2 class="text-2xl font-semibold tracking-tight text-gray-900">Featured Products</h2>
        </div>
        
        <!-- Products Container (Populated by JS) -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-y-10 gap-x-6 xl:gap-x-8">
            <!-- Product Cards will be injected here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-100 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="md:flex md:items-center md:justify-between text-center md:text-left">
                <div class="flex justify-center md:justify-start space-x-6 md:order-2 mb-4 md:mb-0">
                    <a href="#" class="text-gray-400 hover:text-gray-500">
                        <span class="sr-only">Instagram</span>
                        <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clip-rule="evenodd" /></svg>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-gray-500">
                        <span class="sr-only">Twitter</span>
                        <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84" /></svg>
                    </a>
                </div>
                <div class="mt-8 md:mt-0 md:order-1">
                    <p class="text-base text-gray-400">&copy; 2026 Brand Name. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Cart Overlay -->
    <div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50"></div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 max-w-md w-full bg-white shadow-xl z-50 flex flex-col h-full">
        <!-- Cart Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <h2 class="text-lg font-semibold text-gray-900">Shopping Cart</h2>
            <button id="cart-close-btn" class="text-gray-400 hover:text-gray-900 focus:outline-none">
                <span class="sr-only">Close panel</span>
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Cart Items Area -->
        <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 no-scrollbar">
            <!-- Empty state -->
            <div id="cart-empty-state" class="h-full flex flex-col items-center justify-center text-center text-gray-500">
                <svg class="w-12 h-12 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <p>カートは空です。</p>
            </div>
            
            <!-- Items List (Populated by JS) -->
            <ul id="cart-items-list" class="space-y-6 hidden">
                <!-- Cart item template injected here -->
            </ul>
        </div>

        <!-- Cart Footer (Total & Checkout) -->
        <div class="border-t border-gray-100 p-6 bg-gray-50">
            <div class="flex justify-between text-base font-medium text-gray-900 mb-4">
                <p>Subtotal</p>
                <p id="cart-subtotal">¥0</p>
            </div>
            <p class="text-sm text-gray-500 mb-6">送料と税金は購入手続き画面で計算されます。</p>
            <button id="checkout-btn" class="w-full flex items-center justify-center rounded-none border border-transparent bg-black px-6 py-4 text-base font-medium text-white shadow-sm hover:bg-gray-800 focus:outline-none transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Checkout
            </button>
            <div class="mt-6 flex justify-center text-center text-sm text-gray-500">
                <p>
                    or 
                    <button type="button" class="font-medium text-black hover:text-gray-700 pb-1 border-b border-black" onclick="document.getElementById('cart-close-btn').click()">
                        Continue Shopping<span aria-hidden="true"> &rarr;</span>
                    </button>
                </p>
            </div>
        </div>
    </div>

    <!-- Custom Toast / Modal (Replaces alert()) -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-black text-white px-6 py-3 rounded shadow-lg z-50 flex items-center space-x-3">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-message" class="text-sm font-medium">Message here</span>
    </div>

    <!-- Application Logic -->
    <script>
        // 1. Product Data (Dummy data for the prototype)
        const products = [
            {
                id: 'p_1',
                name: 'Heavyweight Logo Hoodie',
                price: 12000,
                image: 'https://placehold.co/600x800/f8fafc/0f172a?text=Hoodie',
                color: 'Black'
            },
            {
                id: 'p_2',
                name: 'Oversized Blank T-Shirt',
                price: 6500,
                image: 'https://placehold.co/600x800/f8fafc/0f172a?text=T-Shirt',
                color: 'White'
            },
            {
                id: 'p_3',
                name: 'Signature Cap',
                price: 4800,
                image: 'https://placehold.co/600x800/f8fafc/0f172a?text=Cap',
                color: 'Navy'
            },
            {
                id: 'p_4',
                name: 'Everyday Tote Bag',
                price: 3500,
                image: 'https://placehold.co/600x800/f8fafc/0f172a?text=Tote',
                color: 'Natural'
            }
        ];

        // 2. Application State
        let cart = [];

        // 3. DOM Elements
        const productGrid = document.getElementById('product-grid');
        const cartSidebar = document.getElementById('cart-sidebar');
        const cartOverlay = document.getElementById('cart-overlay');
        const cartToggleBtn = document.getElementById('cart-toggle-btn');
        const cartCloseBtn = document.getElementById('cart-close-btn');
        const cartBadge = document.getElementById('cart-badge');
        const cartEmptyState = document.getElementById('cart-empty-state');
        const cartItemsList = document.getElementById('cart-items-list');
        const cartSubtotal = document.getElementById('cart-subtotal');
        const checkoutBtn = document.getElementById('checkout-btn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // 4. Initialization
        function init() {
            renderProducts();
            updateCartUI();
            setupEventListeners();
        }

        // 5. Render Products to DOM
        function renderProducts() {
            productGrid.innerHTML = products.map(product => `
                <div class="group relative flex flex-col">
                    <div class="aspect-w-3 aspect-h-4 bg-gray-200 rounded-sm overflow-hidden group-hover:opacity-90 transition duration-300">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-center object-cover">
                    </div>
                    <div class="mt-4 flex flex-col flex-1">
                        <h3 class="text-sm text-gray-900 font-medium">
                            <a href="#" class="absolute inset-0 z-10" aria-hidden="true"></a>
                            ${product.name}
                        </h3>
                        <p class="mt-1 text-sm text-gray-500">${product.color}</p>
                        <p class="mt-2 text-sm font-semibold text-gray-900">¥${product.price.toLocaleString()}</p>
                    </div>
                    <div class="mt-4 z-20 relative">
                        <button onclick="addToCart('${product.id}')" class="w-full border border-black text-black bg-white hover:bg-black hover:text-white px-4 py-2 text-sm font-medium transition duration-200">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 6. Cart Logic
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            showToast(`${product.name} をカートに追加しました`);
            openCart(); // Auto-open cart for better feedback in prototype
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                removeFromCart(productId);
            } else {
                updateCartUI();
            }
        }

        function getCartTotal() {
            return cart.reduce((total, item) => total + (item.price * item.quantity), 0);
        }

        function getCartItemCount() {
            return cart.reduce((count, item) => count + item.quantity, 0);
        }

        // 7. Update Cart UI
        function updateCartUI() {
            const itemCount = getCartItemCount();
            
            // Update Badge
            if (itemCount > 0) {
                cartBadge.textContent = itemCount;
                cartBadge.classList.remove('hidden');
            } else {
                cartBadge.classList.add('hidden');
            }

            // Update Sidebar Content
            if (cart.length === 0) {
                cartEmptyState.classList.remove('hidden');
                cartItemsList.classList.add('hidden');
                checkoutBtn.disabled = true;
            } else {
                cartEmptyState.classList.add('hidden');
                cartItemsList.classList.remove('hidden');
                checkoutBtn.disabled = false;
                
                // Render Cart Items
                cartItemsList.innerHTML = cart.map(item => `
                    <li class="flex py-2">
                        <div class="h-24 w-20 flex-shrink-0 overflow-hidden rounded-sm border border-gray-200 bg-gray-50">
                            <img src="${item.image}" alt="${item.name}" class="h-full w-full object-cover object-center">
                        </div>
                        <div class="ml-4 flex flex-1 flex-col">
                            <div>
                                <div class="flex justify-between text-sm font-medium text-gray-900">
                                    <h3>${item.name}</h3>
                                    <p class="ml-4">¥${(item.price * item.quantity).toLocaleString()}</p>
                                </div>
                                <p class="mt-1 text-sm text-gray-500">${item.color}</p>
                            </div>
                            <div class="flex flex-1 items-end justify-between text-sm">
                                <div class="flex items-center border border-gray-300 rounded-sm">
                                    <button onclick="updateQuantity('${item.id}', -1)" class="px-2 py-1 text-gray-600 hover:text-black hover:bg-gray-100 transition">-</button>
                                    <span class="px-2 font-medium">${item.quantity}</span>
                                    <button onclick="updateQuantity('${item.id}', 1)" class="px-2 py-1 text-gray-600 hover:text-black hover:bg-gray-100 transition">+</button>
                                </div>
                                <button type="button" onclick="removeFromCart('${item.id}')" class="font-medium text-gray-400 hover:text-red-500 transition">Remove</button>
                            </div>
                        </div>
                    </li>
                `).join('');
            }

            // Update Total
            cartSubtotal.textContent = `¥${getCartTotal().toLocaleString()}`;
        }

        // 8. Sidebar Toggle Logic
        function openCart() {
            cartSidebar.classList.add('open');
            cartOverlay.classList.add('open');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeCart() {
            cartSidebar.classList.remove('open');
            cartOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        // 9. Toast Notification System (Replacement for window.alert)
        let toastTimeout;
        function showToast(message, isCheckout = false) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            if (isCheckout) {
                // Change icon for checkout
                toast.innerHTML = `
                    <svg class="w-5 h-5 text-blue-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="text-sm font-medium">${message}</span>
                `;
            } else {
                // Reset to normal success icon
                toast.innerHTML = `
                    <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span class="text-sm font-medium">${message}</span>
                `;
            }

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 10. Checkout Simulation
        function simulateCheckout() {
            if (cart.length === 0) return;
            
            showToast("Stripe（決済画面）へリダイレクトしています...", true);
            closeCart();
            
            // Dummy processing delay
            setTimeout(() => {
                // Reset cart after dummy checkout
                cart = [];
                updateCartUI();
                showToast("決済が完了しました（デモ用）");
            }, 2500);
        }

        // 11. Event Listeners
        function setupEventListeners() {
            cartToggleBtn.addEventListener('click', openCart);
            cartCloseBtn.addEventListener('click', closeCart);
            cartOverlay.addEventListener('click', closeCart);
            checkoutBtn.addEventListener('click', simulateCheckout);
        }

        // Run application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
